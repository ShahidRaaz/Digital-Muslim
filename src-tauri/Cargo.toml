[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

tauri-plugin-log = "2"
tauri-plugin-autostart = { version = "=2.5.1" }
tauri-plugin-opener = { version = "=2.5.3" }
tauri-plugin-notification = "2"
tauri-plugin-geolocation = { version = "=2.3.3" }
